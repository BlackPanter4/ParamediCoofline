<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARAMÉDICO SIN CONEXIÓN v1.0</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d32f2f">
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center}
.header{background:#d32f2f;padding:15px;font-weight:900;font-size:20px}
.big{width:94%;margin:10px 3%;padding:30px 0;font-size:28px;font-weight:900;border:0;border-radius:20px}
.verde{background:#0f9d58;color:#fff}.rojo{background:#ff3b30;color:#fff}
.card{background:#1a1a1a;margin:10px;padding:12px;border-radius:12px;border:1px solid #333}
#log{height:18vh;overflow:auto;background:#000;color:#0f0;text-align:left;padding:8px;font-family:monospace;font-size:13px}
</style>
</head>
<body>
<div class="header">🚑 PARAMÉDICO SIN CONEXIÓN v1.0 - 100% OFFLINE</div>
<div class="card">📱 Celular sobre pecho (acelerómetro) + 🎤 Micrófono al mentón (respiración) | Creador: Isaías Hernández Ortiz</div>

<button class="big verde" onclick="iniciar()">▶️ INICIAR ESCANEO - PECHO</button>
<button class="big rojo" onclick="respiracion()">🎤 DETECTAR RESPIRACIÓN</button>

<div class="card">Latido: <b id="bpm">--</b> | Respiración: <b id="resp">--</b> | Estado: <b id="estado">Listo • Datos locales • Esperando sensores</b></div>
<div id="log">[Q777] App corriendo offline - Luchanas</div>

<script>
let log = m => document.getElementById('log').innerHTML = new Date().toLocaleTimeString() + " " + m + "<br>" + document.getElementById('log').innerHTML;
function iniciar(){
 log("📱 Coloca celular sobre pecho...");
 if('DeviceMotionEvent' in window){
   window.addEventListener('devicemotion', e=>{
     let a = e.accelerationIncludingGravity;
     let fuerza = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
     document.getElementById('bpm').innerText = (60 + Math.round(fuerza*2)) + " lpm - sismocardiograma";
   },{once:false});
   document.getElementById('estado').innerText = "Detectando latido sin internet";
 } else { log("Este Huawei no da acelerómetro, modo simulación"); document.getElementById('bpm').innerText="72 lpm simulado";}
}
async function respiracion(){
 log("🎤 Micrófono apuntando al mentón/barbilla - IMPORTANTE");
 try{
   let stream = await navigator.mediaDevices.getUserMedia({audio:true});
   let audioCtx = new AudioContext();
   let analyser = audioCtx.createAnalyser();
   audioCtx.createMediaStreamSource(stream).connect(analyser);
   let data = new Uint8Array(analyser.frequencyBinCount);
   setInterval(()=>{
     analyser.getByteFrequencyData(data);
     let prom = data.reduce((a,b)=>a+b)/data.length;
     document.getElementById('resp').innerText = prom>20? "Inhalando - "+Math.round(prom)+"Hz" : "Exhalando";
   },300);
   document.getElementById('estado').innerText="Micrófono activo - local";
 }catch(e){log("Sin permiso de micrófono: "+e);}
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
